<style>
/* Layout: a cartographer's sheet. Tall main map on the left, Gush Dan inset and city card on the right, city index below. */
:root{
  --bg:#f3f4f0; --paper:#fffefb; --ink:#1c2430; --muted:#5d6670; --line:#d9dcd4;
  --sea:#d5e5ec; --sea-ink:#5f8296;
  --land:#f1e4c8; --land-edge:#b79f73;
  --other:#e7e4dc; --other-edge:#c3beb2;
  --pal:#ece6d8;
  --accent:#1f4fa0; --accent-soft:#dfe8f7; --dot:#2b3442; --halo:#fffefb;
  --f-display:"Suez One","Frank Ruhl Libre",Georgia,serif;
  --f-body:"Assistant","Segoe UI",system-ui,sans-serif;
  --f-heb:"Frank Ruhl Libre","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --paper:#151d23; --ink:#e8ebe6; --muted:#9aa5ad; --line:#2a353d;
  --sea:#14283a; --sea-ink:#7fa3bd;
  --land:#463c2b; --land-edge:#9c8559;
  --other:#252b30; --other-edge:#3d464d; --pal:#2f3330;
  --accent:#8db2f2; --accent-soft:#1d2d47; --dot:#e8ebe6; --halo:#151d23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --paper:#151d23; --ink:#e8ebe6; --muted:#9aa5ad; --line:#2a353d;
  --sea:#14283a; --sea-ink:#7fa3bd;
  --land:#463c2b; --land-edge:#9c8559;
  --other:#252b30; --other-edge:#3d464d; --pal:#2f3330;
  --accent:#8db2f2; --accent-soft:#1d2d47; --dot:#e8ebe6; --halo:#151d23; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;border-bottom:2px solid var(--ink);padding-bottom:14px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0;text-wrap:balance}
.heb-title{font-family:var(--f-heb);font-weight:700;font-size:clamp(24px,3.6vw,34px);direction:rtl;margin:0;color:var(--accent)}
.lede{margin:0;color:var(--muted);max-width:60ch}
.stage{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel-head .h{font-family:var(--f-heb);letter-spacing:0;text-transform:none;font-size:16px;color:var(--ink)}
.right{display:flex;flex-direction:column;gap:22px;min-width:0}
svg{display:block;width:100%;height:auto}
.sea{fill:var(--sea)}
.c-other{fill:var(--other);stroke:var(--other-edge);stroke-width:.8;vector-effect:non-scaling-stroke}
.c-pal{fill:var(--pal);stroke:var(--other-edge);stroke-width:1;stroke-dasharray:3 2.5;vector-effect:non-scaling-stroke}
.c-il{fill:var(--land);stroke:var(--land-edge);stroke-width:1.1;vector-effect:non-scaling-stroke}
.lake{fill:var(--sea);stroke:var(--sea-ink);stroke-width:.5;vector-effect:non-scaling-stroke}
.region{font-family:var(--f-body);fill:var(--muted);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.water{font-family:var(--f-body);fill:var(--sea-ink);font-style:italic;font-weight:600}
.box{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.city{cursor:pointer;outline:none}
.city .hit{fill:transparent}
.city .pt{fill:var(--dot);stroke:var(--halo);stroke-width:1.5}
.city .ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
.city .en{font-family:var(--f-body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round}
.city .he{font-family:var(--f-heb);font-weight:500;fill:var(--muted);paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round}
.city .lead{stroke:var(--muted);stroke-width:.8;fill:none;opacity:.7}
.city:hover .en,.city:focus-visible .en{fill:var(--accent)}
.city.sel .pt{fill:var(--accent)}
.city.sel .ring{opacity:1}
.city.sel .en{fill:var(--accent)}
.city.sel .he{fill:var(--accent)}
.city.sel .lead{stroke:var(--accent);opacity:1;stroke-width:1.4}
.city:focus-visible .ring{opacity:1;stroke-dasharray:3 2}
.note{padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.card{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px}
.card-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1}
.card .heb{font-family:var(--f-heb);font-weight:700;font-size:32px;direction:rtl;color:var(--accent);line-height:1.2}
.tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:3px}
.fact{margin:0;max-width:62ch;font-size:17px}
.src{margin:0;font-size:14px;color:var(--muted)}
.src b{color:var(--ink);font-weight:600}
.index h3{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.chip{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:7px 10px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.chip span{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip i{font-style:normal;font-family:var(--f-heb);color:var(--muted);font-size:15px;direction:rtl;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.chip[aria-pressed="true"] i{color:var(--paper)}
@media (max-width:780px){.stage{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.city .ring{transition:opacity .15s}.chip{transition:background .15s,border-color .15s}}
</style>

const CITIES=[
 {id:"ashdod",en:"Ashdod",he:"אַשְׁדּוֹד",lat:31.80,lon:34.65,tag:"Southern coast",fact:"One of the five Philistine cities in the Bible. Today it has one of Israel's two biggest seaports, where ships bring goods from all over the world.",src:"1 Samuel 5",srcNote:"the Ark is brought to Ashdod"},
 {id:"ashkelon",en:"Ashkelon",he:"אַשְׁקְלוֹן",lat:31.668,lon:34.574,tag:"Southern coast",fact:"A seaside city with very old roots. Archaeologists found a city gate here with an arch built about 3,800 years ago, one of the oldest arches in the world.",src:"2 Samuel 1:20",srcNote:"David's lament mentions its streets",mainLbl:"left"},
 {id:"batyam",en:"Bat Yam",he:"בַּת יָם",lat:32.017,lon:34.745,tag:"Central coast",fact:"Its name means \"Daughter of the Sea.\" The city sits on the beach just south of Tel Aviv-Yafo, with a long seaside promenade.",inset:"L"},
 {id:"beersheba",en:"Beersheba",he:"בְּאֵר שֶׁבַע",lat:31.252,lon:34.791,tag:"Negev",fact:"The largest city in the Negev desert. In the Torah, Abraham digs a well here and makes a promise (shevuah) with Abimelech, which gives the place its name.",src:"Genesis 21:31",srcNote:"how Beer-sheba got its name",mainLbl:"right"},
 {id:"beitshemesh",en:"Beit Shemesh",he:"בֵּית שֶׁמֶשׁ",lat:31.747,lon:34.988,tag:"Judean foothills",fact:"Its name means \"House of the Sun.\" In the Bible, the Ark of the Covenant arrives here on a cart pulled by two cows after the Philistines send it back.",src:"1 Samuel 6",srcNote:"the Ark returns",mainLbl:"below"},
 {id:"bneibrak",en:"Bnei Brak",he:"בְּנֵי בְּרַק",lat:32.084,lon:34.834,tag:"Gush Dan",fact:"A crowded city known for its many yeshivot. The Passover Haggadah tells about five rabbis in Bnei Brak who spent the whole night telling the story of leaving Egypt.",src:"Joshua 19:45",srcNote:"listed in the land of the tribe of Dan",inset:"R"},
 {id:"haifa",en:"Haifa",he:"חֵיפָה",lat:32.794,lon:34.989,tag:"Northern coast",fact:"A port city that climbs up the slopes of Mount Carmel. It is home to the Technion, Israel's oldest university, and the terraced Bahá'í Gardens.",src:"1 Kings 18",srcNote:"Elijah on Mount Carmel",mainLbl:"left"},
 {id:"herzliya",en:"Herzliya",he:"הֶרְצְלִיָּה",lat:32.166,lon:34.843,tag:"Sharon",fact:"Named for Theodor Herzl, the father of modern political Zionism. Today many high-tech companies have offices here, close to the beach.",inset:"L"},
 {id:"holon",en:"Holon",he:"חוֹלוֹן",lat:32.011,lon:34.774,tag:"Gush Dan",fact:"Its name comes from the Hebrew word for sand (chol), since it was built on sand dunes. It is home to the Israel Children's Museum and the Design Museum Holon.",inset:"R"},
 {id:"jerusalem",en:"Jerusalem",he:"יְרוּשָׁלַיִם",lat:31.778,lon:35.235,tag:"Judean hills",fact:"Israel's largest city and the seat of its government. The Kotel, the Old City, and its four quarters are all here. Jews have faced toward Jerusalem in prayer for thousands of years.",src:"Psalm 122",srcNote:"a song of going up to Jerusalem",mainLbl:"right"},
 {id:"kfarsaba",en:"Kfar Saba",he:"כְּפַר סָבָא",lat:32.178,lon:34.908,tag:"Sharon",fact:"Founded in 1903 as a farming village surrounded by orange groves. Today it is a green city in the Sharon plain, with lots of parks.",inset:"R"},
 {id:"lod",en:"Lod",he:"לוֹד",lat:31.951,lon:34.895,tag:"Central",fact:"One of the oldest cities in the country. Ben Gurion Airport, Israel's main international airport, sits right next to Lod.",src:"Ezra 2:33",srcNote:"people of Lod return from Babylon",inset:"R"},

 {id:"telaviv",en:"Tel Aviv-Yafo",he:"תֵּל אָבִיב-יָפוֹ",lat:32.085,lon:34.781,tag:"Central coast",fact:"Tel Aviv was founded in 1909 next to the ancient port of Yafo (Jaffa). Its thousands of white Bauhaus-style buildings earned it the nickname \"the White City.\"",src:"Jonah 1:3",srcNote:"Jonah sets sail from Jaffa",inset:"L"}
];
CITIES.find(c=>c.id==="ashdod").inset="L";

const NS="http://www.w3.org/2000/svg";
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e};
function drawLand(svg,scale){
  const g=el("g",{},svg);
  for(const [name,d] of Object.entries(SHAPES)){
    if(name.startsWith("LAKE:"))continue;
    const cls=name==="Israel"?"c-il":name==="Palestine"?"c-pal":"c-other";
    el("path",{d,class:cls},g);
  }
  for(const [name,d] of Object.entries(SHAPES)) if(name.startsWith("LAKE:")) el("path",{d,class:"lake"},g);
  return g;
}
function text(parent,x,y,str,cls,size,anchor="start",extra={}){const t=el("text",{x,y,class:cls,"font-size":size,"text-anchor":anchor,...extra},parent);t.textContent=str;return t}

const nodes={};
function addNode(id,g){(nodes[id]=nodes[id]||[]).push(g)}
function cityGroup(parent,c,label){
  const g=el("g",{class:"city",tabindex:"0",role:"button","aria-label":c.en,"data-id":c.id},parent);
  g.addEventListener("click",()=>select(c.id));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(c.id)}});
  addNode(c.id,g);return g;
}

/* ---------- main map ---------- */
const main=document.getElementById("main");
const VB=[95,25,395,820];
main.setAttribute("viewBox",VB.join(" "));
el("rect",{x:VB[0],y:VB[1],width:VB[2],height:VB[3],class:"sea"},main);
drawLand(main);
const R=(lat,lon,str,cls,size,extra)=>{const [x,y]=P(lat,lon);return text(main,x,y,str,cls,size,"middle",extra)};
R(33.5,35.62,"Lebanon","region",9.5);
R(33.05,36.0,"Syria","region",9.5);
R(31.15,35.95,"Jordan","region",9.5);
R(30.25,34.05,"Egypt","region",9.5);
R(30.55,34.88,"Negev","region",9.5,{opacity:.85});
R(32.25,35.28,"West Bank","region",7.5);
R(31.47,34.05,"Gaza Strip","region",7.5);
R(32.7,34.25,"Mediterranean","water",11);
text(main,P(32.62,34.25)[0],P(32.62,34.25)[1],"Sea","water",11,"middle");
R(31.48,35.62,"Dead Sea","water",7.5);
R(32.84,35.86,"Sea of Galilee","water",7);

// inset box
const IB={latT:32.36,latB:31.77,lonL:34.52,lonR:35.02};
{const [x1,y1]=P(IB.latT,IB.lonL),[x2,y2]=P(IB.latB,IB.lonR);el("rect",{x:x1,y:y1,width:x2-x1,height:y2-y1,class:"box",rx:2},main)}

const mainLayer=el("g",{},main);
for(const c of CITIES){
  const [x,y]=P(c.lat,c.lon);
  const g=cityGroup(mainLayer,c);
  if(c.inset){ // small dot only, label lives in the close-up
    el("circle",{cx:x,cy:y,r:7,class:"hit"},g);
    el("circle",{cx:x,cy:y,r:5.5,class:"ring"},g);
    el("circle",{cx:x,cy:y,r:2.2,class:"pt"},g);
    continue;
  }
  el("circle",{cx:x,cy:y,r:14,class:"hit"},g);
  el("circle",{cx:x,cy:y,r:8,class:"ring"},g);
  el("circle",{cx:x,cy:y,r:3.8,class:"pt"},g);
  let ax,ay,anc;
  if(c.mainLbl==="left"){ax=x-8;ay=y-1;anc="end"}
  else if(c.mainLbl==="right"){ax=x+8;ay=y-1;anc="start"}
  else {ax=x;ay=y+17;anc="middle"}
  text(g,ax,ay,c.en,"en",13,anc);
  text(g,ax,ay+14,c.he,"he",12.5,anc);
}

/* ---------- inset ---------- */
const inset=document.getElementById("inset");
const IW=720,IH=620,S=4.7,TX=150,TY=32;
const [ix0,iy0]=P(IB.latT,IB.lonL);
const Q=(lat,lon)=>{const [x,y]=P(lat,lon);return [(x-ix0)*S+TX,(y-iy0)*S+TY]};
inset.setAttribute("viewBox",`0 0 ${IW} ${IH}`);
el("rect",{x:0,y:0,width:IW,height:IH,class:"sea"},inset);
const landG=drawLand(inset);
landG.setAttribute("transform",`translate(${TX - ix0*S} ${TY - iy0*S}) scale(${S})`);
{const [x,y]=Q(32.245,34.6);text(inset,x,y,"Mediterranean Sea","water",22,"middle")}

function spread(items,minGap,top,bottom){
  items.sort((a,b)=>a.ty-b.ty);
  for(let i=0;i<items.length;i++){items[i].ly=Math.max(items[i].ty,i?items[i-1].ly+minGap:top)}
  if(items.length&&items[items.length-1].ly>bottom){items[items.length-1].ly=bottom;for(let i=items.length-2;i>=0;i--)items[i].ly=Math.min(items[i].ly,items[i+1].ly-minGap)}
}
const insetCities=CITIES.filter(c=>c.inset).map(c=>{const [x,y]=Q(c.lat,c.lon);return {c,x,y,ty:y}});
const L=insetCities.filter(o=>o.c.inset==="L"), Rr=insetCities.filter(o=>o.c.inset==="R");
spread(L,74,50,IH-40);spread(Rr,66,50,IH-40);
const RX=Math.max(...Rr.map(o=>o.x))+46;
const layer=el("g",{},inset);
function insetCity(o,side){
  const g=cityGroup(layer,o.c);
  const ax=side==="L"? Math.min(o.x-40, o.x-40) : RX;
  const tx=side==="L"? ax-6 : ax+6;
  el("path",{d:`M${o.x},${o.y} L${side==="L"?o.x-14:o.x+14},${o.y} L${ax},${o.ly-6} `,class:"lead"},g);
  const en=text(g,tx,o.ly,o.c.en,"en",23,side==="L"?"end":"start");
  text(g,tx,o.ly+24,o.c.he,"he",22,side==="L"?"end":"start");
  el("circle",{cx:o.x,cy:o.y,r:16,class:"hit"},g);
  el("circle",{cx:o.x,cy:o.y,r:13,class:"ring"},g);
  el("circle",{cx:o.x,cy:o.y,r:6.5,class:"pt"},g);
}
L.forEach(o=>insetCity(o,"L"));Rr.forEach(o=>insetCity(o,"R"));

/* ---------- chips + card ---------- */
const chips=document.getElementById("chips");
const chipEls={};
[...CITIES].sort((a,b)=>a.en.localeCompare(b.en)).forEach(c=>{
  const b=document.createElement("button");b.className="chip";b.type="button";b.id="chip-"+c.id;
  b.innerHTML=`<span></span><i lang="he"></i>`;b.querySelector("span").textContent=c.en;b.querySelector("i").textContent=c.he;
  b.addEventListener("click",()=>select(c.id));chips.appendChild(b);chipEls[c.id]=b;
});
const card=document.getElementById("card");
function select(id){
  const c=CITIES.find(x=>x.id===id);if(!c)return;
  Object.entries(nodes).forEach(([k,arr])=>arr.forEach(g=>{g.classList.toggle("sel",k===id);if(k===id)g.parentNode.appendChild(g)}));
  Object.entries(chipEls).forEach(([k,b])=>b.setAttribute("aria-pressed",k===id?"true":"false"));
  card.innerHTML=`<span class="tag"></span><div class="card-top"><h2></h2><div class="heb" lang="he"></div></div><p class="fact"></p>${c.src?'<p class="src">In the Tanakh: <b></b> <span></span></p>':""}`;
  card.querySelector(".tag").textContent=c.tag;
  card.querySelector("h2").textContent=c.en;
  card.querySelector(".heb").textContent=c.he;
  card.querySelector(".fact").textContent=c.fact;
  if(c.src){card.querySelector(".src b").textContent=c.src;card.querySelector(".src span").textContent="("+c.srcNote+")"}
  try{localStorage.setItem("il-city",id)}catch(e){}
}
let start="jerusalem";try{const s=localStorage.getItem("il-city");if(s&&CITIES.some(c=>c.id===s))start=s}catch(e){}
select(start);
</script>
