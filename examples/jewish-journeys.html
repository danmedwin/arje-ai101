<title>Jewish Journeys</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: a classroom wall map. Big map with the story card beside it, a timeline rail along the bottom that drives everything. */
:root{
  --bg:#f4f6f3; --paper:#ffffff; --ink:#1d2731; --muted:#5b6670; --line:#dbe0da;
  --sea:#cfe1e8; --land:#e7e3d7; --border:#c9c2b0; --sea-ink:#58798b; --halo:#ffffff;
  --ancient:#b55d16; --medieval:#26815a; --early:#8b45b0; --modern:#1d63c0;
  --ancient-t:#f7e7d8; --medieval-t:#dcefe5; --early-t:#efe2f6; --modern-t:#dde8f7;
  --f-display:"Fredoka","Varela Round","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151a; --paper:#161e25; --ink:#e7ebe8; --muted:#9ba7af; --line:#2b3640;
  --sea:#13283a; --land:#2a3033; --border:#46504f; --sea-ink:#7fa2ba; --halo:#161e25;
  --ancient:#eb9a57; --medieval:#5ccb93; --early:#c38fe6; --modern:#74aef4;
  --ancient-t:#3a2a1c; --medieval-t:#1a3529; --early-t:#30223b; --modern-t:#1b2b42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151a; --paper:#161e25; --ink:#e7ebe8; --muted:#9ba7af; --line:#2b3640;
  --sea:#13283a; --land:#2a3033; --border:#46504f; --sea-ink:#7fa2ba; --halo:#161e25;
  --ancient:#eb9a57; --medieval:#5ccb93; --early:#c38fe6; --modern:#74aef4;
  --ancient-t:#3a2a1c; --medieval-t:#1a3529; --early-t:#30223b; --modern-t:#1b2b42; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 24px}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(32px,5.4vw,52px);line-height:1;margin:0;letter-spacing:-.01em}
.heb-title{font-family:var(--f-display);font-weight:500;font-size:clamp(22px,3.4vw,32px);margin:0;color:var(--muted);direction:rtl}
.lede{margin:6px 0 0;color:var(--muted);max-width:60ch}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:stretch}
.mapbox{background:var(--sea);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0;position:relative}
#map{display:block;width:100%;height:auto;aspect-ratio:815/672;max-width:100%}
.land{fill:var(--land)}
.borders{fill:none;stroke:var(--border);stroke-width:.7;vector-effect:non-scaling-stroke}
.lakes{fill:var(--sea)}
.geo{font-family:var(--f-body);fill:var(--muted);font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.75;font-size:calc(var(--u)*11px)}
.water{font-family:var(--f-body);fill:var(--sea-ink);font-style:italic;font-size:calc(var(--u)*12px)}
.shaft{fill:none;stroke-linecap:butt}
.halo-path{fill:none;stroke:var(--halo);opacity:.85}
.ghost{fill:none;opacity:.28}
.active .shaft,.active .halo-path{stroke-dasharray:1;stroke-dashoffset:0}
.place .dot{fill:var(--ink);stroke:var(--halo)}
.place text{font-family:var(--f-body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){
  .active .shaft,.active .halo-path{animation:draw 1s ease-out both}
  .active .head{animation:pop .3s ease-out .85s both}
  .place{animation:pop .3s ease-out .2s both}
}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0}to{opacity:1}}
.legend{position:absolute;right:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;max-width:calc(100% - 20px)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:5px;border-radius:3px;display:inline-block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.era-tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:20px;color:var(--c);background:var(--t)}
.date{font-family:var(--f-display);font-weight:600;color:var(--c);font-size:20px;line-height:1}
.card h2{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.card p{margin:0}
.why{border-top:1px dashed var(--line);padding-top:10px}
.why b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.word{background:var(--t);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline}
.word .lbl{grid-column:1/-1;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--c)}
.word .heb{font-family:var(--f-display);font-weight:600;font-size:26px;direction:rtl;color:var(--c);line-height:1.2}
.word .tr{font-weight:700}
.word .mean{grid-column:1/-1;font-size:15px}
.allnote{color:var(--muted)}
.timeline{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls .spacer{flex:1}
.btn{font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:7px 16px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,.stop:focus-visible{outline:3px solid var(--modern);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rail-scroll{overflow-x:auto;padding-bottom:4px}
.rail{min-width:780px;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));row-gap:8px;position:relative}
.band{grid-row:1;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c);background:var(--t);text-align:center}
.track{grid-row:2;grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;align-self:center;margin:0 5%}
.stop{grid-row:2/4;font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 4px 4px;text-align:center;border-radius:8px}
.stop .pip{width:22px;height:22px;border-radius:50%;background:var(--paper);border:4px solid var(--c);margin-top:-2px;transition:transform .15s}
.stop .d{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--c);line-height:1.1;margin-top:2px}
.stop .n{font-size:13px;line-height:1.25;color:var(--muted)}
.stop:hover .pip{transform:scale(1.15)}
.stop[aria-current="true"] .pip{background:var(--c);transform:scale(1.3);box-shadow:0 0 0 4px var(--t)}
.stop[aria-current="true"] .n{color:var(--ink);font-weight:700}
.credit{font-size:12px;color:var(--muted);margin:0}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
@media (max-width:520px){.legend{display:none}.card h2{font-size:24px}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Jewish Journeys</h1>
      <p class="lede">Over thousands of years, Jewish families moved from place to place. Tap a stop on the timeline to follow the arrows.</p>
    </div>
    <p class="heb-title" lang="he">מַסְעֵי עַם יִשְׂרָאֵל</p>
  </header>

  <div class="stage">
    <div class="mapbox">
      <svg id="map" viewBox="0 0 815 672" role="img" aria-label="Map showing Jewish migration routes"></svg>
      <div class="legend" id="legend" aria-hidden="true"></div>
    </div>
    <article class="card" id="card" aria-live="polite"></article>
  </div>

  <section class="timeline" aria-label="Timeline">
    <div class="controls">
      <button class="btn" id="prev" type="button">◀ Back</button>
      <button class="btn" id="play" type="button" aria-pressed="false">▶ Play</button>
      <button class="btn" id="next" type="button">Next ▶</button>
      <span class="spacer"></span>
      <button class="btn" id="all" type="button" aria-pressed="false">Show all journeys</button>
    </div>
    <div class="rail-scroll"><div class="rail" id="rail"><div class="track"></div></div></div>
  </section>
  <p class="credit">Map outlines: Natural Earth. Arrows show the general direction people traveled, not exact roads or sea routes.</p>
</div>

/* ---------- static map ---------- */
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("map");
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
el("rect",{x:-50,y:-50,width:915,height:772,fill:"var(--sea)"},svg);
el("path",{d:SH.land,class:"land"},svg);
el("path",{d:SH.lakes,class:"lakes"},svg);
el("path",{d:SH.borders,class:"borders"},svg);
const geoG=el("g",{},svg);
[[57,-62,"North America","geo"],[-14,-60,"South America","geo"],[47,22,"Europe","geo"],[7,20,"Africa","geo"],[46,56,"Asia","geo"],
 [27,-42,"Atlantic Ocean","water"],[34.6,18,"Mediterranean Sea","water"]].forEach(([la,lo,s,c])=>{const [x,y]=P(la,lo);const t=el("text",{x,y,class:c,"text-anchor":"middle"},geoG);t.textContent=s});
const ghostG=el("g",{},svg), activeG=el("g",{},svg), placeG=el("g",{},svg);

const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const legend=document.getElementById("legend");
Object.values(ERAS).forEach(e=>{const s=document.createElement("span");s.innerHTML=`<i style="background:var(${e.c})"></i>`;s.append(e.name);legend.appendChild(s)});

/* ---------- geometry ---------- */
function curve(a,b,bend){
  const [x1,y1]=P(PL[a][0],PL[a][1]),[x2,y2]=P(PL[b][0],PL[b][1]);
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
  return {x1,y1,x2,y2,cx:(x1+x2)/2+(-dy/len)*bend*len,cy:(y1+y2)/2+(dx/len)*bend*len,len};
}
const qpt=(g,t)=>[(1-t)*(1-t)*g.x1+2*(1-t)*t*g.cx+t*t*g.x2,(1-t)*(1-t)*g.y1+2*(1-t)*t*g.cy+t*t*g.y2];

let U=1,UF=1, view=[...FULL], current=0, showAll=false, items=[];
function buildRoutes(){
  ghostG.innerHTML="";activeG.innerHTML="";placeG.innerHTML="";items=[];
  const activeStops=showAll?STOPS.map((s,i)=>i):[current];
  STOPS.forEach((s,i)=>{
    const isActive=activeStops.includes(i), isGhost=!showAll&&i<current;
    if(!isActive&&!isGhost)return;
    s.routes.forEach(([a,b,bend])=>{
      const g=curve(a,b,bend),col=`var(${ERAS[s.era].c})`;
      if(isActive){
        const grp=el("g",{class:"active"},activeG);
        const halo=el("path",{class:"halo-path",pathLength:"1"},grp);
        const shaft=el("path",{class:"shaft",stroke:col,pathLength:"1"},grp);
        const head=el("path",{class:"head",fill:col,stroke:"var(--halo)","stroke-linejoin":"round"},grp);
        items.push({type:"arrow",g,halo,shaft,head,w:showAll?5:11});
      }else{
        const p=el("path",{class:"ghost",stroke:col},ghostG);items.push({type:"ghost",g,p});
      }
    });
  });
  // places for active stops
  const used=new Map();
  activeStops.forEach(i=>STOPS[i].routes.forEach(r=>r.slice(0,2).forEach(k=>used.set(k,(STOPS[i].labels||{})[k]||used.get(k)||PL[k][2]))));
  const ALLKEEP=["newyork","buenos","recife","spain","london","amsterdam","krakow","moscow","israel","babylon","yemen","ethiopia","istanbul","rome","morocco"];
  if(showAll) used.forEach((v,k)=>{if(k==="israel")used.set(k,"Israel");if(!ALLKEEP.includes(k))used.set(k,"")});
  used.forEach((label,k)=>{
    const [x,y]=P(PL[k][0],PL[k][1]);const side=PL[k][3];
    const grp=el("g",{class:"place"},placeG);
    let dot=null;
    if(side!=="edge") dot=el("circle",{class:"dot"},grp);
    const t=el("text",{},grp);t.textContent=label;if(!label&&side==="edge")grp.remove();
    items.push({type:"place",x,y,side,dot,t});
  });
}
function layout(){
  const fs=(showAll?11.5:14)*UF;
  for(const it of items){
    if(it.type==="ghost"){const g=it.g;it.p.setAttribute("d",`M${g.x1},${g.y1}Q${g.cx},${g.cy} ${g.x2},${g.y2}`);it.p.setAttribute("stroke-width",3*U);continue}
    if(it.type==="arrow"){
      const G=it.g,w=it.w*U,hl=w*2.1,hw=w*1.35,gap=9*U;
      const nrm=(ax,ay,bx,by)=>{const l=Math.hypot(bx-ax,by-ay)||1;return [(bx-ax)/l,(by-ay)/l]};
      const [ux,uy]=nrm(G.x1,G.y1,G.cx,G.cy),[vx,vy]=nrm(G.x2,G.y2,G.cx,G.cy);
      const g={x1:G.x1+ux*gap,y1:G.y1+uy*gap,cx:G.cx,cy:G.cy,x2:G.x2+vx*gap,y2:G.y2+vy*gap,len:G.len};
      // direction at the end, then pull the shaft back so the head covers it
      const [ex,ey]=qpt(g,0.985);const ang=Math.atan2(g.y2-ey,g.x2-ex);
      const pull=Math.min(hl*0.85,g.len*0.4);
      const sx=g.x2-Math.cos(ang)*pull,sy=g.y2-Math.sin(ang)*pull;
      const d=`M${g.x1},${g.y1}Q${g.cx},${g.cy} ${sx},${sy}`;
      it.shaft.setAttribute("d",d);it.shaft.setAttribute("stroke-width",w);
      it.halo.setAttribute("d",d);it.halo.setAttribute("stroke-width",w+3.5*U);
      const c=Math.cos(ang),s=Math.sin(ang),bx=g.x2-c*hl,by=g.y2-s*hl;
      it.head.setAttribute("d",`M${g.x2},${g.y2}L${bx-s*hw},${by+c*hw}L${bx+s*hw},${by-c*hw}Z`);
      it.head.setAttribute("stroke-width",1.5*U);
      continue}
    if(it.type==="place"){
      const r=4.5*U,off=9*U;
      if(it.dot){it.dot.setAttribute("cx",it.x);it.dot.setAttribute("cy",it.y);it.dot.setAttribute("r",r);it.dot.setAttribute("stroke-width",2*U)}
      let tx=it.x+off,ty=it.y+fs*0.35,anc="start";
      if(it.side==="l"){tx=it.x-off;anc="end"}
      else if(it.side==="b"){tx=it.x;ty=it.y+off+fs*0.8;anc="middle"}
      else if(it.side==="t"){tx=it.x;ty=it.y-off;anc="middle"}
      else if(it.side==="edge"){tx=Math.min(it.x,view[0]+view[2])-6*U;ty=it.y+off+fs*1.1;anc="end"}
      it.t.setAttribute("x",tx);it.t.setAttribute("y",ty);it.t.setAttribute("text-anchor",anc);
      it.t.setAttribute("font-size",fs);it.t.setAttribute("stroke-width",4*UF);
    }
  }
}
function targetView(){
  if(showAll)return [...FULL];
  let xs=[],ys=[];
  STOPS[current].routes.forEach(([a,b,bend])=>{const g=curve(a,b,bend);xs.push(g.x1,g.x2,(g.x1+g.cx*2+g.x2)/4);ys.push(g.y1,g.y2,(g.y1+g.cy*2+g.y2)/4)});
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  let w=x1-x0,h=y1-y0;if(w<230){x0-=(230-w)/2;x1+=(230-w)/2;w=230}const padX=Math.max(w*0.22,40),padY=Math.max(h*0.22,40);
  x0-=padX;x1+=padX*1.3;y0-=padY;y1+=padY;w=x1-x0;h=y1-y0;
  if(w/h<ASPECT){const nw=h*ASPECT;x0-=(nw-w)/2;w=nw}else{const nh=w/ASPECT;y0-=(nh-h)/2;h=nh}
  if(w>FULL[2]){return [...FULL]}
  x0=Math.max(0,Math.min(x0,FULL[2]-w));y0=Math.max(0,Math.min(y0,FULL[3]-h));
  return [x0,y0,w,h];
}
function setView(v){
  view=v;svg.setAttribute("viewBox",v.map(n=>n.toFixed(2)).join(" "));
  const px=svg.getBoundingClientRect().width||800;UF=v[2]/px;U=UF*Math.max(0.55,Math.min(1,px/820));
  svg.style.setProperty("--u",UF);layout();
}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let anim=0;
function flyTo(v){
  cancelAnimationFrame(anim);
  if(reduce){setView(v);return}
  const from=[...view],t0=performance.now(),D=900;
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const step=now=>{const t=Math.min(1,(now-t0)/D),e=ease(t);setView(from.map((f,i)=>f+(v[i]-f)*e));if(t<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
}
addEventListener("resize",()=>setView(view));

/* ---------- card ---------- */
const card=document.getElementById("card");
function renderCard(){
  if(showAll){
    card.style.cssText="";
    card.innerHTML=`<h2>Every journey at once</h2><p>Each arrow shows a time when Jewish families moved. The colors show when it happened.</p><p class="allnote">Look closely: some places, like the Land of Israel, Spain, and Poland, have arrows going in and coming out. People arrived, built communities, and sometimes had to move again.</p><p class="allnote">Tap any stop on the timeline to zoom in on one journey.</p>`;
    return;
  }
  const s=STOPS[current],e=ERAS[s.era];
  card.style.setProperty("--c",`var(${e.c})`);card.style.setProperty("--t",`var(${e.t})`);
  card.innerHTML=`<span class="era-tag"></span><div class="date"></div><h2></h2><p class="txt"></p><p class="why"><b>Why did they move?</b><span></span></p><div class="word"><span class="lbl">Word to know</span><span class="heb" lang="he"></span><span class="tr"></span><span class="mean"></span></div>`;
  card.querySelector(".era-tag").textContent=e.name;
  card.querySelector(".date").textContent=s.date;
  card.querySelector("h2").textContent=s.title;
  card.querySelector(".txt").textContent=s.text;
  card.querySelector(".why span").textContent=s.why;
  const [he,tr,mean]=s.word;
  card.querySelector(".heb").textContent=he;card.querySelector(".tr").textContent=tr;card.querySelector(".mean").textContent=mean;
}

/* ---------- timeline ---------- */
const rail=document.getElementById("rail");
let col=1;
Object.entries(ERAS).forEach(([k,e])=>{
  const n=STOPS.filter(s=>s.era===k).length;
  const b=document.createElement("div");b.className="band";b.style.gridColumn=`${col} / span ${n}`;
  b.style.setProperty("--c",`var(${e.c})`);b.style.setProperty("--t",`var(${e.t})`);b.textContent=e.name;rail.appendChild(b);col+=n;
});
const stopEls=STOPS.map((s,i)=>{
  const b=document.createElement("button");b.type="button";b.className="stop";b.style.gridColumn=String(i+1);
  b.style.setProperty("--c",`var(${ERAS[s.era].c})`);b.style.setProperty("--t",`var(${ERAS[s.era].t})`);
  b.innerHTML=`<span class="pip"></span><span class="d"></span><span class="n"></span>`;
  b.querySelector(".d").textContent=s.date;b.querySelector(".n").textContent=s.short;
  b.addEventListener("click",()=>{stopPlay();go(i)});rail.appendChild(b);return b;
});
const allBtn=document.getElementById("all");
function go(i,all=false){
  current=Math.max(0,Math.min(STOPS.length-1,i));showAll=all;
  stopEls.forEach((b,j)=>b.setAttribute("aria-current",(!all&&j===current)?"true":"false"));
  allBtn.setAttribute("aria-pressed",all?"true":"false");
  buildRoutes();layout();flyTo(targetView());renderCard();
  if(!all){const b=stopEls[current];const sc=b.closest(".rail-scroll");const l=b.offsetLeft-sc.clientWidth/2+b.offsetWidth/2;sc.scrollTo({left:l,behavior:reduce?"auto":"smooth"})}
  try{localStorage.setItem("jj-stop",all?"all":String(current))}catch(e){}
}
document.getElementById("prev").addEventListener("click",()=>{stopPlay();go(showAll?0:current-1)});
document.getElementById("next").addEventListener("click",()=>{stopPlay();go(showAll?0:current+1)});
allBtn.addEventListener("click",()=>{stopPlay();showAll?go(current):go(current,true)});
const playBtn=document.getElementById("play");let timer=null;
function stopPlay(){if(timer){clearInterval(timer);timer=null}playBtn.setAttribute("aria-pressed","false");playBtn.textContent="▶ Play"}
playBtn.addEventListener("click",()=>{
  if(timer){stopPlay();return}
  if(showAll||current===STOPS.length-1)go(0);
  playBtn.setAttribute("aria-pressed","true");playBtn.textContent="❚❚ Pause";
  timer=setInterval(()=>{if(current>=STOPS.length-1){stopPlay();return}go(current+1)},8000);
});
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea"))return;if(e.key==="ArrowRight"){stopPlay();go(current+1)}if(e.key==="ArrowLeft"){stopPlay();go(current-1)}});

let start=0,startAll=false;try{const s=localStorage.getItem("jj-stop");if(s==="all")startAll=true;else if(s!==null&&!isNaN(+s))start=+s}catch(e){}
view=[...FULL];
go(start,startAll);
</script>
